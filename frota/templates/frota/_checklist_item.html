<div class="checklist-row group flex items-center gap-3 px-5 py-4 transition-all duration-100 border-l-[3px] select-none {% if field.value %}is-ok{% endif %}">

    <!-- Label -->
    <span class="check-label flex-1 text-sm font-medium leading-snug transition-colors duration-100">
        {{ field.label }}
    </span>

    <!-- Escolha explícita: nenhuma opção pré-selecionada -->
    <div class="flex items-center gap-1.5 flex-shrink-0">
        <button type="button" class="check-btn check-btn-ok {% if field.value %}is-active{% endif %} text-[11px] font-bold px-3 py-1.5 rounded-lg border transition-all duration-100"
                onclick="definirItem(this, true)">
            <i class="fas fa-check text-[9px]"></i> OK
        </button>
        <button type="button" class="check-btn check-btn-avaria text-[11px] font-bold px-3 py-1.5 rounded-lg border transition-all duration-100"
                onclick="definirItem(this, false)">
            <i class="fas fa-triangle-exclamation text-[9px]"></i> Avaria
        </button>
    </div>

    <!-- Hidden real input -->
    <input type="checkbox"
           name="{{ field.html_name }}"
           id="{{ field.id_for_label }}"
           class="sr-only checklist-cb"
           {% if field.value %}checked{% endif %}>
</div>
