<label class="checklist-row group flex items-center gap-3.5 px-5 py-4 cursor-pointer transition-all duration-100 border-l-[3px] select-none
    {% if field.value %}bg-emerald-50/60 border-l-emerald-400{% else %}border-l-transparent hover:bg-slate-50/60{% endif %}">

    <!-- Custom checkbox visual -->
    <div class="check-visual relative w-5 h-5 rounded flex items-center justify-center flex-shrink-0 transition-all duration-100
        {% if field.value %}bg-emerald-500 border-emerald-500{% else %}bg-white border-2 border-slate-300 group-hover:border-slate-400{% endif %}"
         style="{% if field.value %}border:none{% endif %}">
        <svg class="check-mark w-3 h-3 transition-all duration-100 {% if not field.value %}opacity-0 scale-50{% else %}opacity-100 scale-100{% endif %}"
             viewBox="0 0 12 9" fill="none">
            <path d="M1.5 4.5L4.5 7.5L10.5 1.5"
                  stroke="white" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </div>

    <!-- Label -->
    <span class="check-label flex-1 text-sm font-medium leading-snug transition-colors duration-100
        {% if field.value %}text-slate-500{% else %}text-slate-700 group-hover:text-slate-900{% endif %}">
        {{ field.label }}
    </span>

    <!-- Status badge -->
    <span class="check-badge flex-shrink-0 text-[10px] font-semibold px-2 py-0.5 rounded-full transition-all duration-100
        {% if field.value %}bg-emerald-100 text-emerald-600{% else %}text-slate-300{% endif %}">
        {% if field.value %}OK{% else %}—{% endif %}
    </span>

    <!-- Hidden real input -->
    <input type="checkbox"
           name="{{ field.html_name }}"
           id="{{ field.id_for_label }}"
           class="sr-only checklist-cb"
           onchange="onItemToggle(this)"
           {% if field.value %}checked{% endif %}>
</label>
