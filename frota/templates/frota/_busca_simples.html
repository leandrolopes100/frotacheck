<form method="GET" class="relative">
    <i class="fas fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-xs" style="color:#484f58"></i>
    <input type="text" name="busca" value="{{ request.GET.busca }}" placeholder="{{ placeholder }}"
           class="form-input pl-9 pr-9 text-sm {{ input_width_class|default:'w-52' }}"
           style="border-radius:8px">
    {% if request.GET.busca %}
    <a href="?" class="absolute right-3 top-1/2 -translate-y-1/2 transition-colors text-hover-red">
        <i class="fas fa-xmark text-xs"></i>
    </a>
    {% endif %}
</form>
