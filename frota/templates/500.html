<!DOCTYPE html>
<html lang="pt-br" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro interno | FrotaCheck</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='rgb(35,134,54)'/><polyline points='8,17 13.5,23 25,9' fill='none' stroke='white' stroke-width='4.6' stroke-linecap='round' stroke-linejoin='round'/></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0d1117; color: #e6edf3; -webkit-font-smoothing: antialiased; }
        .btn-cta:hover { box-shadow: 0 6px 20px rgba(63,185,80,0.35); }
    </style>
</head>
<body class="h-full flex items-center justify-center">
    <div class="text-center px-6 max-w-md">
        <div class="w-24 h-24 rounded-[2rem] flex items-center justify-center mx-auto mb-8"
             style="background:rgba(248,81,73,0.1); border:1px solid rgba(248,81,73,0.2); box-shadow:0 8px 30px rgba(248,81,73,0.1)">
            <i class="fas fa-triangle-exclamation text-4xl" style="color:#f85149"></i>
        </div>
        <p class="text-[10px] font-black uppercase tracking-[0.3em] mb-3" style="color:#484f58">Erro 500</p>
        <h1 class="text-5xl font-black tracking-tighter mb-4" style="color:#e6edf3">Falha no servidor</h1>
        <p class="font-medium text-sm mb-10 leading-relaxed" style="color:#8b949e">
            Ocorreu um erro interno inesperado. Nossa equipe foi notificada.<br>Tente novamente em alguns instantes.
        </p>
        <a href="/"
           class="inline-flex items-center gap-2 px-8 py-4 rounded-2xl font-black text-sm uppercase tracking-widest transition-all btn-cta"
           style="background:#3fb950; color:#0d1117; box-shadow:0 4px 14px rgba(63,185,80,0.2)">
            <i class="fas fa-arrow-left text-xs"></i>
            Voltar ao Dashboard
        </a>
    </div>
</body>
</html>
