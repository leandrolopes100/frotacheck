<!DOCTYPE html>
<html lang="pt-br" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada | Frota Check</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚚</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="h-full flex items-center justify-center">
    <div class="text-center px-6 max-w-md">
        <div class="w-24 h-24 bg-blue-50 rounded-[2rem] flex items-center justify-center mx-auto mb-8 shadow-lg shadow-blue-100">
            <i class="fas fa-truck-moving text-4xl text-blue-500"></i>
        </div>
        <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] mb-3">Erro 404</p>
        <h1 class="text-5xl font-black text-slate-900 tracking-tighter mb-4">Rota não encontrada</h1>
        <p class="text-slate-500 font-medium text-sm mb-10 leading-relaxed">
            A página que você tentou acessar não existe ou foi movida.<br>Verifique o endereço ou volte ao início.
        </p>
        <a href="/"
           class="inline-flex items-center gap-2 px-8 py-4 bg-slate-900 text-white rounded-2xl font-black text-sm uppercase tracking-widest hover:bg-blue-600 transition-all shadow-xl shadow-slate-200">
            <i class="fas fa-arrow-left text-xs"></i>
            Voltar ao Dashboard
        </a>
    </div>
</body>
</html>
