<!DOCTYPE html>
<html lang="pt-br" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada | FrotaCheck</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚚</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0d1117; color: #e6edf3; -webkit-font-smoothing: antialiased; }
    </style>
</head>
<body class="h-full flex items-center justify-center">
    <div class="text-center px-6 max-w-md">
        <div class="w-24 h-24 rounded-[2rem] flex items-center justify-center mx-auto mb-8"
             style="background:rgba(56,139,253,0.1); border:1px solid rgba(56,139,253,0.2); box-shadow:0 8px 30px rgba(56,139,253,0.1)">
            <i class="fas fa-truck-moving text-4xl" style="color:#388bfd"></i>
        </div>
        <p class="text-[10px] font-black uppercase tracking-[0.3em] mb-3" style="color:#484f58">Erro 404</p>
        <h1 class="text-5xl font-black tracking-tighter mb-4" style="color:#e6edf3">Rota não encontrada</h1>
        <p class="font-medium text-sm mb-10 leading-relaxed" style="color:#8b949e">
            A página que você tentou acessar não existe ou foi movida.<br>Verifique o endereço ou volte ao início.
        </p>
        <a href="/"
           class="inline-flex items-center gap-2 px-8 py-4 rounded-2xl font-black text-sm uppercase tracking-widest transition-all"
           style="background:#3fb950; color:#0d1117; box-shadow:0 4px 14px rgba(63,185,80,0.2)"
           onmouseover="this.style.boxShadow='0 6px 20px rgba(63,185,80,0.35)'"
           onmouseout="this.style.boxShadow='0 4px 14px rgba(63,185,80,0.2)'">
            <i class="fas fa-arrow-left text-xs"></i>
            Voltar ao Dashboard
        </a>
    </div>
</body>
</html>
